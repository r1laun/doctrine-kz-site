name: daily-sync
# Автосинхронизация с Google Таблицей: каждую ночь забирает свежие CSV,
# пересобирает сайт, пушит изменения и заливает docs/ на Hoster.kz по FTPS.
on:
  schedule:
    - cron: "0 22 * * *" # 03:00 по Алматы (UTC+5)
  workflow_dispatch: # ручной запуск кнопкой Run workflow
permissions:
  contents: write
concurrency:
  group: daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download schedule CSV
        run: |
          curl -sSL "https://docs.google.com/spreadsheets/d/1OSTcmJxk-X7Spxsn5z1B5dSvM0XSEfWewP9UzP_4_V8/export?format=csv" -o _original/schedule_new.csv
      - name: Rebuild site
        run: |
          python3 tools/make_data.py
          python3 tools/build.py
      - name: Sanity check
        run: |
          python3 -c "import json; c=json.load(open('docs/data/courses.json')); assert len(c)>0 and sum(len(x['sessions']) for x in c)>0, 'empty data'"
          test -s docs/index.html
          test -s docs/ru/index.html
          test -s docs/kk/index.html
          test -s docs/en/index.html
          test -s docs/ru/schedule.html
          test -s docs/ru/teachers.html
          test -s docs/data/teachers.json
          test -f docs/assets/css/main.css
          echo "pre-deploy check OK: $(find docs -type f | wc -l) files"
      - name: Backup docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.run_number }}
          path: docs/
          retention-days: 30
      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "doctrine-bot"
          git config user.email "bot@doctrine.kz"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes, skip push"
          else
            git commit -m "data: автообновление расписания из таблицы"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check deploy secrets
        id: deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -n "$FTP_HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Hoster.kz via FTPS
        if: steps.commit.outputs.changed == 'true' && steps.deploy.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 120000
          security: loose
          log-level: verbose
          local-dir: ./docs/
          server-dir: /
          # НЕ включать dangerous-clean-slate: true — иначе при обрыве заливки
          # httpdocs остается пустым (был инцидент: осталось только .cagefs).
          # Без вайпа синк только перезаписывает файлы, сайт не ложится.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
      - name: Post-deploy check
        if: steps.commit.outputs.changed == 'true' && steps.deploy.outputs.ready == 'true'
        run: |
          sleep 10
          curl -skL --max-time 30 https://doctrine.kz/ | grep -q "ru/" && echo "site OK" || (echo "site check FAILED"; exit 1)
